# Fork-only PR validation. Keep this separate from upstream workflows so the
# fork harness remains easy to carry through upstream synchronization.
name: Fork Harness

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Deterministic harness check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run fork harness
        run: >-
          nix develop -c nu .agents/commands/check
          --diff-base "${{ github.event.pull_request.base.sha }}"
